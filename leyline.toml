# Leyline — Server Configuration
#
# Changes take effect on next server start.
# Decks are managed through the Arena client UI (stored in player.db).

[server]
# Network ports. CLI args (--fd-port, etc.) override these.
#fd_port = 30010
#md_port = 30003
#debug_port = 8090
#account_port = 9443
#management_port = 8091

# Bridge timeout — how long the engine waits for human priority/action responses (ms).
# Leave unset for local gameplay: priority/action windows wait indefinitely.
#bridge_timeout_ms = 45000

# Prompt fail-safe — how long targeted/modal/search prompts wait before defaulting (ms).
# Leave set for smoke/playtest robustness; unset only for fully manual prompt debugging.
#prompt_failsafe_ms = 45000

# AI turn wait — how long the engine waits for the AI's turn to return priority
# before giving up and suppressing action prompts (ms).
#ai_turn_wait_ms = 30000

# Mulligan wait — how long the engine waits for a keep/mulligan response (ms).
# Must exceed the client-visible mulligan timer to avoid stale dialogs.
#mulligan_wait_ms = 45000

# Player database path (relative to CWD or absolute).
#player_db = "data/player.db"

[game]
# RNG seed for deterministic shuffles. Remove or comment out for random.
#seed = 2

# Which seat wins the die roll and goes first (1 = human, 2 = AI).
# Omit or leave unset for random (default).
#die_roll_winner = 1

# Skip mulligan phase — auto-keep opening hand to speed up playtesting.
# Leave disabled when exercising mulligan flow; enable only for scripted probes
# where the opening-hand dialog would obscure the scenario under test.
skip_mulligan = true

# Send decision timer (rope) on priority grant. Disable to suppress countdown.
timer = false

# AI opponent deck (name from player.db). Use "random" for a random non-selected deck.
# In spectator_mode, "random" picks a random pair for both AI seats.
# Omit for mirror match (same as seat 1).
#ai_deck = "Green stompy"

# Run both game seats under Forge AI; attach the client as a read-only viewer.
#spectator_mode = false

[ai]
# AI animation speed. 2 = twice as fast, 1 = default, 0 = instant.
speed = 1.0

[draft]
# Bot draft picker: "forge" uses Forge's built-in picker, "model" uses a bundled local model.
#picker = "model"
#model_dir = "data/draft-models"

[dev]
# Crash on unexpected nulls/fallbacks (missing grpId, instanceId not in map,
# protocol sequencing errors). Off = warn + fallback (production behavior).
strict = false

# Crash when auto-pass fires from missing data (bridge timeouts, prompt
# timeouts, auto-resolve). Off = pass priority silently (production behavior).
strict_pass = false

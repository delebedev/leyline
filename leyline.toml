# Leyline — Server Configuration
#
# One immutable configuration snapshot is resolved once at startup from this
# file plus LEYLINE_* environment overrides. Changes take effect on next start.
#
# Precedence: typed default < leyline.toml < LEYLINE_* environment override.
# The environment name derives mechanically from the canonical key path:
# `native.fd_port` → `LEYLINE_NATIVE_FD_PORT`, `paths.artifacts` →
# `LEYLINE_PATHS_ARTIFACTS`. Unknown keys, malformed overrides, and invalid
# combinations fail startup.
#
# Relative path values resolve against this file's directory, never the
# process working directory. `LEYLINE_INSTANCE=<name>` starts an additional
# instance with isolated state and artifact paths beneath the configured bases.

[native]
# Front Door listener port (client auth + deck management).
fd_port = 30010
# Match Door listener port (game protocol).
md_port = 30003
# Local control HTTP listener port.
debug_port = 8090
# Account (auth) HTTPS listener port.
account_port = 9443
# Management HTTP (health checks) listener port.
management_port = 8091
# Advertised Front Door authority. A bare host advertises `host:<fd_port>`;
# a `host:port` value is used verbatim.
# external_host = "localhost"
# Local control listener bind address (127.0.0.1 = loopback only).
# debug_bind = "127.0.0.1"

[engine]
# Bridge timeout — how long the engine waits for human priority/action
# responses (ms). Unset = priority/action windows wait indefinitely.
#bridge_timeout_ms = 45000

# Prompt fail-safe — how long targeted/modal/search prompts wait before
# defaulting (ms). Unset = no prompt timeout.
#prompt_failsafe_ms = 45000

# AI turn wait — how long the engine waits for the AI's turn to return
# priority before giving up and suppressing action prompts (ms).
#ai_turn_wait_ms = 30000

# Mulligan wait — how long the engine waits for a keep/mulligan response (ms).
#mulligan_wait_ms = 45000

# RNG seed for deterministic shuffles. Unset = random each game.
#seed = 2

# Which seat wins the die roll and goes first (1 = human, 2 = AI).
# Unset = random (default).
#die_roll_winner = 1

# Skip mulligan phase — auto-keep opening hand to speed up playtesting.
# Leave disabled when exercising mulligan flow; enable only for scripted probes
# where the opening-hand dialog would obscure the scenario under test.
skip_mulligan = true

# Send decision timer (rope) on priority grant. Disable to suppress countdown.
timer = false

# AI opponent deck (name from player.db). Use "random" for a random
# non-selected deck. In spectator_mode, "random" picks a random pair for both
# AI seats. Unset = mirror match (same as seat 1).
#ai_deck = "Green stompy"

# Run both game seats under Forge AI; attach the client as a read-only viewer.
#spectator_mode = false

# AI animation speed. 2 = twice as fast, 1 = default, 0 = instant.
ai_speed = 1.0

[engine.draft]
# Bot draft picker: "forge" uses Forge's built-in picker, "model" uses a
# bundled local model.
picker = "forge"
# Directory (relative to this file) containing one subdirectory per set with
# weights.json(.gz) and card_meta.json.
#model_dir = "data/draft-models"

[engine.dev]
# Crash on unexpected nulls/fallbacks (missing grpId, instanceId not in map,
# protocol sequencing errors). Off = warn + fallback (production behavior).
strict = false

# Crash when auto-pass fires from missing data (bridge timeouts, prompt
# timeouts, auto-resolve). Off = pass priority silently (production behavior).
strict_pass = false

# Enables automatic local prompt handling. Off by default.
#copilot_autopush = false

# Endpoint for local prompt handling.
#copilot_bridge_url = "http://127.0.0.1:8092"

[paths]
# Persistent mutable state directory; `player.db` lives inside. Unset = the
# durable user-level location shared across worktrees.
#state = ""

# Per-instance artifact root for logs, protocol dumps, and sessions
# (relative to this file).
artifacts = "logs"

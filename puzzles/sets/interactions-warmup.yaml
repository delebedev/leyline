name: interactions-warmup
description: Activated ability and simple zone movement protocol smoke.
scenarios:
  - id: activated-ability
    puzzle: activated-ability
    run: activate Goblin Fireslinger
    expect: opponent takes one damage
    steps:
      - expect:
          action: { type: activate, card: Goblin Fireslinger }
      - activate: Goblin Fireslinger
      - target: opponent
      - resolve_stack: {}
      - expect:
          opponent_life: 19
  - id: channel-twinshot
    puzzle: channel-twinshot
    run: channel Twinshot Sniper at opponent
    expect: opponent takes 2 damage from hand-zone activation
    steps:
      - expect:
          action: { type: activate, card: Twinshot Sniper }
      - activate: { card: Twinshot Sniper, zone: hand }
      - target: opponent
      - resolve_stack: {}
      - expect:
          all:
            - opponent_life: 3
            - zone_contains: { side: ours, zone: graveyard, card: Twinshot Sniper }
  - id: dfc-transform-concealing-curtains
    puzzle: dfc-transform-activate
    run: activate Concealing Curtains and resolve its transform trigger
    expect: Concealing Curtains becomes Revealing Eye on the battlefield
    steps:
      - expect:
          action: { type: activate, card: Concealing Curtains }
      - activate: Concealing Curtains
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Revealing Eye }
            - zone_not_contains: { side: ours, zone: battlefield, card: Concealing Curtains }
            - stack_empty: true
  - id: electroduplicate-copy-token
    puzzle: electroduplicate-copy
    run: copy Grizzly Bears with Electroduplicate
    expect: copy token is created and Electroduplicate leaves hand
    steps:
      - expect:
          action: { type: cast, card: Electroduplicate }
      - cast: Electroduplicate
      - target: { side: ours, zone: battlefield, card: Grizzly Bears }
      - resolve_stack: {}
      - expect:
          all:
            - zone_not_contains: { side: ours, zone: hand, card: Electroduplicate }
            - stack_empty: true
  - id: bite-down-fight-removal
    puzzle: bite-down
    run: cast Bite Down using Grizzly Bears to remove opposing Grizzly Bears
    expect: opposing Grizzly Bears leaves battlefield
    steps:
      - expect:
          action: { type: cast, card: Bite Down }
      - cast: Bite Down
      - target: { side: ours, zone: battlefield, card: Grizzly Bears }
      - target: { side: opponent, zone: battlefield, card: Grizzly Bears }
      - resolve_stack: {}
      - expect:
          all:
            - zone_not_contains: { side: opponent, zone: battlefield, card: Grizzly Bears }
            - stack_empty: true

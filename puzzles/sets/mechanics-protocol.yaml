      - expect:
          prompt: PayCostsReq
      - select_cost: { zone: battlefield, cards: [Coral Merfolk, Grizzly Bears, Llanowar Elves, Savannah Lions, Monastery Swiftspear, Healer's Hawk, Sol Ring] }
      - resolve_stack: {}
      - expect:
          all:
            - annotation_seen: CastingTimeOption
            - zone_contains: { side: ours, zone: graveyard, card: Ruinous Waterbending }
            - zone_contains: { side: ours, zone: graveyard, card: Coral Merfolk }
            - zone_contains: { side: ours, zone: graveyard, card: Grizzly Bears }
            - zone_contains: { side: ours, zone: battlefield, card: Monastery Swiftspear }
            - zone_contains: { side: ours, zone: battlefield, card: Sol Ring }
            - zone_contains: { side: ours, zone: battlefield, card: Manalith }

name: mechanics-protocol
description: Focused protocol-mechanic acceptance scenarios promoted from manual puzzles.
scenarios:
  - id: snow-mana-ascendant-spirit
    puzzle: snow-mana-ascendant-spirit
    run: activate Ascendant Spirit using snow mana
    expect: Ascendant Spirit becomes at least 2/3 after the snow activation resolves
    steps:
      - expect:
          action: { type: activate, card: Ascendant Spirit }
      - activate: { card: Ascendant Spirit, ability_index: 0 }
      - resolve_stack: {}
      - expect:
          all:
            - battlefield_stats_at_least: { side: ours, card: Ascendant Spirit, power: 2, toughness: 3 }
            - stack_empty: true
  - id: crew-vehicle
    puzzle: vehicle-crew
    run: crew Brute Suit with Centaur Courser, then attack
    expect: Brute Suit becomes a creature and combat can advance cleanly
    steps:
      - expect:
          action: { type: activate, card: Brute Suit }
      - activate: Brute Suit
      - select_cost: { zone: battlefield, cards: [Centaur Courser] }
      - pass_until:
          prompt: DeclareAttackersReq
          max_passes: 12
      - attack_all: {}
      - expect:
          stack_empty: true
  - id: saddle-drover-grizzly
    puzzle: saddle-drover-grizzly
    run: saddle Drover Grizzly with Grizzly Bears, then attack
    expect: saddle tap payment resolves and attack moves to combat
    steps:
      - expect:
          action: { type: activate, card: Drover Grizzly }
      - activate: Drover Grizzly
      - select_cost: { zone: battlefield, cards: [Grizzly Bears] }
      - resolve_stack: {}
      - pass_until:
          prompt: DeclareAttackersReq
          max_passes: 12
      - attack_all: {}
      - expect:
          stack_empty: true
  - id: coin-flip-tavern-swindler
    puzzle: tavern-swindler-coin-flip
    run: activate Tavern Swindler and resolve its coin flip
    expect: the activation resolves and emits a CoinFlip annotation
    steps:
      - expect:
          action: { type: activate, card: Tavern Swindler }
      - activate: Tavern Swindler
      - resolve_stack: {}
      - expect:
          all:
            - annotation_seen: CoinFlip
            - stack_empty: true
  - id: exhaust-jeong-jeong
    puzzle: exhaust-jeong-jeong
    run: activate Jeong Jeong's exhaust ability
    expect: the activation resolves and emits an AbilityExhausted marker
    steps:
      - expect:
          action: { type: activate, card: "Jeong Jeong, the Deserter" }
      - activate: "Jeong Jeong, the Deserter"
      - resolve_stack: {}
      - expect:
          all:
            - annotation_seen: AbilityExhausted
            - stack_empty: true
  - id: extinction-event-parity-choice
    puzzle: extinction-event-choice
    run: cast Extinction Event and choose even
    expect: Grizzly Bears is exiled and Serra Angel remains on the battlefield
    steps:
      - expect:
          action: { type: cast, card: Extinction Event }
      - cast: Extinction Event
      - pass_until:
          prompt: { type: SelectNReq, prompt_id: 23 }
          max_passes: 8
      - static_choice: { id: 1 }
      - resolve_stack: {}
      - expect:
          all:
            - zone_not_contains: { side: opponent, zone: battlefield, card: Grizzly Bears }
            - zone_contains: { side: opponent, zone: battlefield, card: Serra Angel }
            - zone_contains: { side: ours, zone: graveyard, card: Extinction Event }
            - stack_empty: true
  - id: ward-tax
    puzzle: try-ward-vren
    run: cast Lightning Bolt targeting Vren and pay Ward 2
    expect: ward tax path resolves without countering the spell submission
    steps:
      - expect:
          action: { type: cast, card: Lightning Bolt }
      - cast: Lightning Bolt
      - target: { side: opponent, zone: battlefield, card: "Vren, the Relentless" }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: graveyard, card: Lightning Bolt }
            - stack_empty: true
  - id: suspected-frantic-scapegoat
    puzzle: suspected-frantic-scapegoat
    run: cast Frantic Scapegoat, then suspect Grizzly Bears when it enters
    expect: the Suspected designation moves from Scapegoat to Grizzly Bears
    steps:
      - expect:
          action: { type: cast, card: Frantic Scapegoat }
      - cast: Frantic Scapegoat
      - resolve_stack: {}
      - expect:
          annotation_seen: Designation
      - expect:
          action: { type: cast, card: Grizzly Bears }
      - cast: Grizzly Bears
      - pass_until:
          prompt: { type: SelectNReq, prompt_id: 12761 }
          max_passes: 8
      - select_card: { side: ours, zone: battlefield, card: Grizzly Bears }
      - resolve_stack: {}
      - expect:
          all:
            - annotation_seen: GainDesignation
            - annotation_seen: LoseDesignation
            - zone_contains: { side: ours, zone: battlefield, card: Frantic Scapegoat }
            - zone_contains: { side: ours, zone: battlefield, card: Grizzly Bears }
            - stack_empty: true
  - id: duress-reveal-discard
    puzzle: duress-reveal
    run: cast Duress and choose Murder from the revealed opponent hand
    expect: Murder moves from opponent hand to opponent graveyard
    arena:
      skip: Headless-only for now; Arena SelectN reveal-hand UI is not driven yet.
    steps:
      - expect:
          action: { type: cast, card: Duress }
      - cast: Duress
      - pass_until:
          prompt: SelectNReq
          max_passes: 8
      - select_card: { side: opponent, zone: hand, card: Murder }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: opponent, zone: graveyard, card: Murder }
            - zone_not_contains: { side: opponent, zone: hand, card: Murder }
  - id: deep-cavern-bat-reveal-exile
    puzzle: deep-cavern-bat-reveal-exile
    run: cast Deep-Cavern Bat and choose Divination from the revealed opponent hand
    expect: Divination leaves opponent hand and Deep-Cavern Bat remains on battlefield
    steps:
      - expect:
          action: { type: cast, card: Deep-Cavern Bat }
      - cast: Deep-Cavern Bat
      - pass_until:
          prompt: SelectNReq
          max_passes: 8
      - select_card: { side: opponent, zone: hand, card: Divination }
      - resolve_stack: {}
      - expect:
          all:
            - zone_not_contains: { side: opponent, zone: hand, card: Divination }
            - zone_contains: { side: ours, zone: battlefield, card: Deep-Cavern Bat }
  - id: stock-up-bottom-order
    puzzle: stock-up
    run: cast Stock Up, choose two cards, then order the unchosen cards on bottom
    expect: Stock Up emits SelectNReq 2490 followed by bottom OrderReq 42 and resolves
    steps:
      - expect:
          action: { type: cast, card: Stock Up }
      - cast: Stock Up
      - pass_until:
          prompt: { type: SelectNReq, prompt_id: 2490 }
          max_passes: 8
      - select_cards: { zone: library, cards: [Lightning Bolt, Counterspell] }
      - expect:
          prompt: { type: OrderReq, prompt_id: 42 }
      - order_cards: [Negate, Brainstorm, Ponder]
      - expect:
          all:
            - zone_contains: { side: ours, zone: hand, card: Lightning Bolt }
            - zone_contains: { side: ours, zone: hand, card: Counterspell }
            - zone_contains: { side: ours, zone: graveyard, card: Stock Up }
            - stack_empty: true
  - id: brainstorm-top-order
    puzzle: brainstorm-order
    run: cast Brainstorm, choose two hand cards, then order them on top
    expect: Brainstorm emits SelectNReq 2035 followed by top OrderReq 86 and resolves
    steps:
      - expect:
          action: { type: cast, card: Brainstorm }
      - cast: Brainstorm
      - pass_until:
          prompt: { type: SelectNReq, prompt_id: 2035 }
          max_passes: 8
      - select_cards: { zone: hand, cards: [Island, Forest] }
      - expect:
          prompt: { type: OrderReq, prompt_id: 86 }
      - order_cards: [Forest, Island]
      - expect:
          all:
            - zone_contains: { side: ours, zone: hand, card: Lightning Bolt }
            - zone_contains: { side: ours, zone: graveyard, card: Brainstorm }
            - stack_empty: true
  - id: unearth-gixian-recycler
    puzzle: unearth-gixian-recycler
    run: cast Gixian Recycler, destroy it, then unearth it from graveyard
    expect: Recycler returns from graveyard to battlefield
    steps:
      - expect:
          action: { type: cast, card: Gixian Recycler }
      - cast: Gixian Recycler
      - resolve_stack: {}
      - cast: Lightning Bolt
      - target: { side: ours, zone: battlefield, card: Gixian Recycler }
      - resolve_stack: {}
      - expect:
          zone_contains: { side: ours, zone: graveyard, card: Gixian Recycler }
      - activate: { card: Gixian Recycler, zone: graveyard }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Gixian Recycler }
            - stack_empty: true
  - id: cascade-bloodbraid
    puzzle: cascade-bloodbraid
    run: cast Bloodbraid Elf, accept the cascaded Llanowar Elves cast
    expect: both Bloodbraid Elf and Llanowar Elves resolve to battlefield
    steps:
      - expect:
          action: { type: cast, card: Bloodbraid Elf }
      - cast: Bloodbraid Elf
      - optional_action: { accept: true }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Bloodbraid Elf }
            - zone_contains: { side: ours, zone: battlefield, card: Llanowar Elves }
  - id: discover-geological-appraiser
    puzzle: discover-geological-appraiser
    run: cast Geological Appraiser, accept the discovered Llanowar Elves cast

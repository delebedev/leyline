name: Claude review

# Runs one read-only Claude review when a maintainer adds the `claude-review`
# label to a same-repository, non-draft pull request. Re-add the label to
# review a newer head.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.label.name == 'claude-review' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job token posts the review, so no GitHub App or OIDC exchange is needed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Review this pull request against the criteria in the repository's root REVIEW.md.
            Read REVIEW.md first, then the diff (`gh pr diff`) and the PR description (`gh pr view`).
            Read surrounding code with Read, Glob and Grep where a finding depends on it.

            Report only high-confidence correctness, security or contract findings that this PR introduces.
            Skip style nits, naming, formatting, and anything CI, lint or the type checker already enforces.
            Skip pre-existing problems the PR does not touch or worsen.

            For each finding, post one inline comment with
            `mcp__github_inline_comment__create_inline_comment` (pass `confirmed: true`) on the exact changed lines.
            Start the comment with **must-fix** or **follow-up**, then state the impact and a concrete fix.
            Post no inline comments when there are no findings.

            Finish with exactly one top-level comment via `gh pr comment ${{ github.event.pull_request.number }} --body "..."`,
            at most five lines: `Verdict: APPROVE` or `Verdict: CHANGES`, `Reviewed head: ${{ github.event.pull_request.head.sha }}`,
            and one line per must-fix finding. Use CHANGES only when there is at least one must-fix finding.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 15
            --permission-mode dontAsk
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

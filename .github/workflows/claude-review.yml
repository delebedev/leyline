name: Claude review

# Runs Claude Code's bundled `/code-review` once when a maintainer adds the
# `claude-review` label to a same-repository, non-draft pull request. Findings
# land as inline comments; a script step then posts one verdict comment that
# names the reviewed head. Re-add the label to review a newer head.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.label.name == 'claude-review' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - id: start
        name: Record the review start and the reviewed head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # `gh pr diff` reads the current head, which may be newer than the labelled one.
          head=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          test -n "$head"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - id: review
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        # Below the job limit, so a review that runs long still gets an INCOMPLETE verdict.
        timeout-minutes: 20
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job token posts the review, so no GitHub App or OIDC exchange is needed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Post every finding as it is made; a classifier pass would hold comments
          # until the session ends and could drop one.
          classify_inline_comments: false
          # `high` is the level Claude Code tunes for this model. `max` adds finder
          # subagents and a verify pass at about fifty times the cost and twenty
          # times the duration. The review takes its criteria from REVIEW.md
          # through AGENTS.md, which every review agent loads.
          prompt: /code-review high --comment ${{ github.event.pull_request.number }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --permission-mode dontAsk
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"

      - name: Post the verdict
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ steps.start.outputs.head }}
          SINCE: ${{ steps.start.outputs.at }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: |
          # The review's closing result message, or null when the run never finished.
          result=null
          if [ -f "$EXECUTION_FILE" ]; then
            result=$(jq -c 'map(select(.type == "result")) | last // null' "$EXECUTION_FILE" 2>/dev/null || echo null)
          fi

          # Inline comments posted since this run started. The review starts each
          # one with its severity. A push during the review moves comments to the
          # new head, so the head is not used as a filter.
          incomplete=""
          if ! gh api --paginate "repos/$REPO/pulls/$PR/comments" --jq '.[]' |
            jq -s --arg since "$SINCE" 'map(select(.user.login == "github-actions[bot]" and .created_at >= $since))' \
            > findings.json; then
            echo '[]' > findings.json
            incomplete="- The inline comments could not be read."
          fi
          if ! jq -e '.subtype == "success" and (.is_error | not)' <<<"$result" >/dev/null; then
            incomplete="- The review did not finish."
          fi
          current=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid || true)
          if [ "$current" != "$HEAD_SHA" ]; then
            incomplete="- The head moved to ${current:-an unknown commit} during the review."
          fi
          important=$(jq -r '.[] | select(.body | test("^\\W*Important"; "i"))
            | "- `\(.path):\(.line // .original_line)` \(.body | sub("^\\W*Important\\W*"; ""; "i") | split("\n")[0] | .[0:160])"' findings.json)
          # A finding the review could not anchor to a changed line stays in its result text.
          if [ -z "$important" ] && jq -e '.result // "" | test("🔴|\"severity\"\\s*:\\s*\"important\"")' <<<"$result" >/dev/null; then
            important="- Important findings did not post inline; see this run's summary."
          fi

          {
            if [ -n "$incomplete" ]; then
              echo "Verdict: INCOMPLETE"
              echo "Reviewed head: $HEAD_SHA"
              echo "$incomplete Re-add the label to review again."
              if [ -n "$important" ]; then echo "$important"; fi
            elif [ -n "$important" ]; then
              echo "Verdict: CHANGES"
              echo "Reviewed head: $HEAD_SHA"
              echo "$important"
            else
              echo "Verdict: APPROVE"
              echo "Reviewed head: $HEAD_SHA"
            fi
          } > verdict.md
          gh pr comment "$PR" --repo "$REPO" --body-file verdict.md

          stats="$(jq length findings.json) inline findings"
          if [ -f "$EXECUTION_FILE" ]; then
            stats="$stats; $(jq -r '[.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | .name]
              | group_by(.) | map("\(.[0]) \(length)") | "tool calls: " + join(", ")' "$EXECUTION_FILE" 2>/dev/null || echo "tool calls: unreadable")"
          fi
          stats="$stats; $(jq -r 'if . == null then "no result" else "turns \(.num_turns), cost \(.total_cost_usd), refused \((.permission_denials // []) | map(.tool_name) | join(" ") | if . == "" then "none" else . end)" end' <<<"$result")"
          echo "$stats"
          jq -r '.result // ""' <<<"$result"
          {
            echo "## Claude review"
            cat verdict.md
            echo
            echo "$stats"
            echo
            jq -r '.result // ""' <<<"$result"
          } >> "$GITHUB_STEP_SUMMARY"

name: modal-cancel
description: Repeated-mode cancellation preserves the uncommitted cast and permits a retry.
scenarios:
  - id: cancel-and-retry
    puzzle: eldrazi-confluence-repeat
    run: cancel Eldrazi Confluence twice, then choose three Scions and play Forest
    expect: cancellation preserves the spell and mana, and the retry resolves all three modes
    steps:
      - cast: Eldrazi Confluence
      - cancel_action: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: hand, card: Eldrazi Confluence }
            - zone_not_contains: { side: ours, zone: graveyard, card: Eldrazi Confluence }
            - stack_empty: true
            - action: { type: cast, card: Eldrazi Confluence }
      - cast: Eldrazi Confluence
      - cancel_action: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: hand, card: Eldrazi Confluence }
            - zone_not_contains: { side: ours, zone: graveyard, card: Eldrazi Confluence }
            - stack_empty: true
      - cast: Eldrazi Confluence
      - modal_choice: { indices: [0, 0, 0] }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Eldrazi Scion Token }
            - zone_count_at_least: { side: ours, zone: battlefield, count: 7 }
            - stack_empty: true
      - play_land: Forest
      - expect:
          zone_contains: { side: ours, zone: battlefield, card: Forest }

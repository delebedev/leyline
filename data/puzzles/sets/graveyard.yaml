name: graveyard
description: Small arena-driven graveyard smoke suite focused on alternate-zone actions.
scenarios:
  - id: graveyard-land-play
    puzzle: graveyard-land-play
    run: play Island from the graveyard using Icetill Explorer
    expect: ordinary land play action moves Island from graveyard to battlefield
    steps:
      - wait:
          action: { type: play_land, card: Island }
      - play_land: Island
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Island }
            - zone_not_contains: { side: ours, zone: graveyard, card: Island }
  - id: flashback-think-twice
    puzzle: flashback-think-twice
    run: cast Think Twice from hand, then flash it back from graveyard
    expect: extra card drawn and flashback spell leaves graveyard for exile
    steps:
      - wait:
          action: { type: cast, card: Think Twice }
      - cast: Think Twice
      - resolve_stack: {}
      - expect:
          zone_contains: { side: ours, zone: hand, card: Plains }
      - expect:
          action: { type: cast, card: Think Twice }
      - cast: { card: Think Twice, zone: graveyard }
      - resolve_stack: {}
      - expect:
          all:
            - zone_count_at_least: { side: ours, zone: hand, count: 2 }
            - zone_contains: { side: ours, zone: exile, card: Think Twice }
      - expect:
          all:
            - zone_not_contains: { side: ours, zone: graveyard, card: Think Twice }
            - stack_empty: true
  - id: disturb-lunarch
    puzzle: disturb-lunarch
    run: bolt Lunarch Veteran, then cast its disturb face from graveyard
    expect: Lunarch Veteran dies and Luminous Phantom returns transformed
    steps:
      - wait:
          action: { type: cast, card: Lightning Bolt }
      - cast: Lightning Bolt
      - target: { side: ours, zone: battlefield, card: Lunarch Veteran }
      - resolve_stack: {}
      - expect:
          zone_not_contains: { side: ours, zone: battlefield, card: Lunarch Veteran }
      - wait:
          action: { type: cast, card: Luminous Phantom }
      - cast: { card: Luminous Phantom, zone: graveyard }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Luminous Phantom }
            - stack_empty: true
  - id: emry-graveyard-artifact-cast
    puzzle: emry-graveyard-artifact-cast
    run: activate Emry, target an artifact card in graveyard, then cast it from graveyard
    expect: chosen artifact leaves graveyard and resolves onto the battlefield
    steps:
      - wait:
          action: { type: activate, card: "Emry, Lurker of the Loch" }
      - activate: "Emry, Lurker of the Loch"
      - target: { side: ours, zone: graveyard, card: Manalith }
      - wait:
          action: { type: cast, card: Manalith }
      - cast: { card: Manalith, zone: graveyard }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Manalith }
            - zone_not_contains: { side: ours, zone: graveyard, card: Manalith }
  - id: sevinnes-reclamation-copy
    puzzle: sevinnes-reclamation-copy
    run: flash back Sevinne's Reclamation, return Basilisk Collar, then retarget its copy to Sol Ring
    expect: one cast and its intended copy return exactly two permanents while the card is exiled
    steps:
      - expect:
          action: { type: cast, card: "Sevinne's Reclamation", zone: graveyard }
      - cast: { card: "Sevinne's Reclamation", zone: graveyard }
      - target: { side: ours, zone: graveyard, card: Basilisk Collar }
      - pass_until: { prompt: OptionalActionMessage, max_passes: 4 }
      - optional_action: { accept: true }
      - target: { side: ours, zone: graveyard, card: Sol Ring }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Basilisk Collar }
            - zone_contains: { side: ours, zone: battlefield, card: Sol Ring }
            - zone_contains: { side: ours, zone: exile, card: "Sevinne's Reclamation" }
            - zone_not_contains: { side: ours, zone: graveyard, card: Basilisk Collar }
            - zone_not_contains: { side: ours, zone: graveyard, card: Sol Ring }
            - stack_empty: true

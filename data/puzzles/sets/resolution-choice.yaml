name: resolution-choice
description: A resolving attack trigger pauses for sacrifices before combat continues.
scenarios:
  - id: annihilator-sacrifice
    puzzle: resolution-annihilator-choice
    headless: { full_control: true }
    run: choose six lands for Annihilator and reach blocker declaration
    expect: the selected lands are sacrificed while the creatures remain available
    steps:
      - pass_until:
          prompt: SelectNReq
          max_passes: 20
      - select_cards: { zone: battlefield, cards: [Plains, Island, Swamp, Mountain, Forest, Wastes] }
      - pass_until:
          prompt: DeclareBlockersReq
          max_passes: 12
      - expect:
          all:
            - zone_contains: { side: ours, zone: graveyard, card: Plains }
            - zone_contains: { side: ours, zone: graveyard, card: Island }
            - zone_contains: { side: ours, zone: graveyard, card: Swamp }
            - zone_contains: { side: ours, zone: graveyard, card: Mountain }
            - zone_contains: { side: ours, zone: graveyard, card: Forest }
            - zone_contains: { side: ours, zone: graveyard, card: Wastes }
            - zone_contains: { side: ours, zone: battlefield, card: Healer's Hawk }
            - zone_contains: { side: ours, zone: battlefield, card: Grizzly Bears }
            - stack_empty: true
  - id: atraxa-enter-card-per-type
    puzzle: atraxa-enter-reveal-types
    headless: { full_control: true }
    run: cast Atraxa, choose each card type and take one revealed card of it
    expect: each type choice is followed by a card choice, and the chosen cards reach hand
    steps:
      - cast: Atraxa, Grand Unifier
      - pass_until: { prompt: SelectNReq, max_passes: 8 }
      - static_choice: { id: 2 }
      - select_card: { side: ours, zone: library, card: Llanowar Elves }
      - static_choice: { id: 1 }
      - select_card: { side: ours, zone: library, card: Sol Ring }
      - static_choice: { id: 4 }
      - select_card: { side: ours, zone: library, card: Opt }
      - static_choice: { id: 10 }
      - select_card: { side: ours, zone: library, card: Divination }
      - static_choice: { id: 3 }
      - select_card: { side: ours, zone: library, card: Pacifism }
      - select_card: { side: ours, zone: library, card: Island }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: hand, card: Llanowar Elves }
            - zone_contains: { side: ours, zone: hand, card: Sol Ring }
            - zone_contains: { side: ours, zone: hand, card: Opt }
            - zone_contains: { side: ours, zone: hand, card: Divination }
            - zone_contains: { side: ours, zone: hand, card: Pacifism }
            - zone_contains: { side: ours, zone: hand, card: Island }
            - stack_empty: true
  - id: svella-top-four-cast
    puzzle: svella-top-four-cast
    headless: { full_control: true }
    run: activate Svella's second ability and cast Grizzly Bears from the top four
    expect: both revealed spells are offered, and the chosen one is cast for free
    steps:
      - activate: { card: "Svella, Ice Shaper", ability_index: 1 }
      - pass_until: { prompt: SelectNReq, max_passes: 8 }
      - select_card: { side: ours, zone: library, card: Grizzly Bears }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Grizzly Bears }
            - zone_not_contains: { side: ours, zone: battlefield, card: Llanowar Elves }
            - stack_empty: true
  - id: svella-top-four-decline
    puzzle: svella-top-four-cast
    headless: { full_control: true }
    run: activate Svella's second ability and cast nothing
    expect: the revealed spells stay in the library and resolution completes
    steps:
      - activate: { card: "Svella, Ice Shaper", ability_index: 1 }
      - pass_until: { prompt: SelectNReq, max_passes: 8 }
      - select_cards: { zone: library, cards: [] }
      - resolve_stack: {}
      - expect:
          all:
            - zone_not_contains: { side: ours, zone: battlefield, card: Grizzly Bears }
            - zone_not_contains: { side: ours, zone: battlefield, card: Llanowar Elves }
            - stack_empty: true

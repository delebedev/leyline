name: library-visibility
description: Library inspection smoke coverage for changing and withdrawing the visible top card.
scenarios:
  - id: glarb-current-top
    puzzle: library-top-inspection
    native:
      skip: Native hand spell submission is not reliable.
    run: draw the inspected top card, then return Glarb to hand
    expect: the library top advances and inspection ends when Glarb leaves the battlefield
    # These steps assert gameplay transitions. Native Library inspection and projection tests verify visibility.
    steps:
      - wait:
          action: { type: cast, card: Think Twice }
      - cast: Think Twice
      - resolve_stack: {}
      - expect:
          zone_contains: { side: ours, zone: hand, card: Command Tower }
      - wait:
          action: { type: cast, card: Unsummon }
      - cast: Unsummon
      - target: { side: ours, zone: battlefield, card: "Glarb, Calamity's Augur" }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: hand, card: "Glarb, Calamity's Augur" }
            - zone_not_contains: { side: ours, zone: battlefield, card: "Glarb, Calamity's Augur" }
            - stack_empty: true
  - id: citadel-top-library
    puzzle: citadel-top-library
    run: cast the top creature using life, then remove the permission source
    expect: the creature resolves, two life is paid, and top-library play permission ends
    steps:
      - wait:
          action: { type: cast, card: Grizzly Bears, zone: library }
      - cast: { card: Grizzly Bears, zone: library }
      - resolve_stack: {}
      - expect:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: Grizzly Bears }
            - our_life: 18
            - action: { type: play_land, card: Forest, zone: library }
      - cast: Disenchant
      - target: { side: ours, zone: battlefield, card: "Bolas's Citadel" }
      - resolve_stack: {}
      - expect:
          all:
            - zone_not_contains: { side: ours, zone: battlefield, card: "Bolas's Citadel" }
            - zone_contains: { side: ours, zone: graveyard, card: "Bolas's Citadel" }
            - stack_empty: true

name: phyrexian-mana
description: Explicit mixed life and mana payments.
scenarios:
  - id: krrik-mixed-payment
    puzzle: phyrexian-mana-krrik
    run: cast K'rrik paying two phyrexian symbols with life and one with black mana
    expect: K'rrik resolves and the player has sixteen life
    steps:
      - cast: K'rrik, Son of Yawgmoth
      - expect:
          prompt: CastingTimeOptionsReq
      - mana_type_choices: [phyrexian, black, phyrexian]
      - pass_until:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: "K'rrik, Son of Yawgmoth" }
            - stack_empty: true
          max_passes: 8
      - expect:
          all:
            - our_life: 16
            - zone_contains: { side: ours, zone: battlefield, card: "K'rrik, Son of Yawgmoth" }
  - id: granted-black-mixed-payment
    puzzle: phyrexian-mana-granted-black
    run: cast Phyrexian Obliterator paying two black symbols with life and two with mana
    expect: Phyrexian Obliterator resolves and the player has sixteen life
    steps:
      - cast: Phyrexian Obliterator
      - expect:
          prompt: CastingTimeOptionsReq
      - mana_type_choices: [phyrexian, black, phyrexian, black]
      - pass_until:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: "Phyrexian Obliterator" }
            - stack_empty: true
          max_passes: 8
      - expect:
          all:
            - our_life: 16
            - zone_contains: { side: ours, zone: battlefield, card: Phyrexian Obliterator }
  - id: black-kicker-life-payment
    puzzle: phyrexian-mana-kicker
    run: accept kicker and pay both black symbols with life
    expect: Duskwalker resolves as a three-three and the player has sixteen life
    steps:
      - cast: Duskwalker
      - choose: { optional_cost: kicker }
      - mana_type_choices: [phyrexian, phyrexian]
      - pass_until:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: "Duskwalker" }
            - stack_empty: true
          max_passes: 8
      - expect:
          all:
            - our_life: 16
            - battlefield_stats: { side: ours, card: Duskwalker, power: 3, toughness: 3 }
  - id: declined-black-kicker-life-payment
    puzzle: phyrexian-mana-kicker
    run: decline kicker and pay the base black symbol with life
    expect: Duskwalker resolves as a one-one and the player has eighteen life
    steps:
      - cast: Duskwalker
      - choose: { cto_id: 0 }
      - mana_type_choices: [phyrexian]
      - pass_until:
          all:
            - zone_contains: { side: ours, zone: battlefield, card: "Duskwalker" }
            - stack_empty: true
          max_passes: 8
      - expect:
          all:
            - our_life: 18
            - battlefield_stats: { side: ours, card: Duskwalker, power: 1, toughness: 1 }

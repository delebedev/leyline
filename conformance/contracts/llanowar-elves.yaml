name: Llanowar Elves mana ability
scenario: {suite: mechanics-protocol, id: llanowar-elves-mana}
frames:
  - id: source
    events:
      - id: elf
        type: Card
        lane: object
        op: create
        fields: {raw.zoneId: 28, "raw.cardTypes[0]": Creature, raw.controllerSeatId: 1, raw.uniqueAbilities.length: 1}
  - id: consumer
    events:
      - id: consumer
        type: Card
        lane: object
        op: create
        where: {fields: {raw.zoneId: 27}}
        fields: {raw.zoneId: 27, raw.controllerSeatId: 1}
      - id: consumer-reallocated
        type: ObjectIdChanged
        lane: transient
        keys: [orig_id, new_id]
        equals: {"details.new_id[0]": consumer.affectorId}
      - id: consumer-cast
        type: ZoneTransfer
        lane: transient
        fields: {details.category: [CastSpell], details.zone_src: [31], details.zone_dest: [27]}
        equals: {affectedIds: consumer-reallocated.details.new_id}
  - id: activation
    events:
      - id: created
        type: AbilityInstanceCreated
        lane: transient
        where: {equals: {affectorId: elf.affectorId}}
        keys: [source_zone]
        fields: {details.source_zone: [28], affectedIds.length: 1}
        equals: {affectorId: elf.affectorId}
      - id: tapped
        type: TappedUntappedPermanent
        lane: transient
        keys: [tapped]
        fields: {details.tapped: [1], detailTypes.tapped: Int32}
        equals: {affectorId: "created.affectedIds[0]", "affectedIds[0]": created.affectorId}
      - id: action
        type: UserActionTaken
        lane: transient
        keys: [actionType, abilityGrpId]
        fields: {details.actionType: [4]}
        equals:
          "affectedIds[0]": "created.affectedIds[0]"
          "details.abilityGrpId[0]": "elf.raw.uniqueAbilities[0].grpId"
  - id: payment
    events:
      - id: paid
        type: ManaPaid
        lane: transient
        where: {equals: {affectorId: created.affectorId}}
        keys: [id, color]
        fields: {detailTypes.id: Int32, detailTypes.color: Int32, details.color: [16]}
        equals: {affectorId: created.affectorId, affectedIds: consumer-reallocated.details.new_id}
      - id: retired
        type: AbilityInstanceDeleted
        lane: transient
        where: {equals: {affectedIds: created.affectedIds}}
        keys: []
        equals: {affectorId: created.affectorId, affectedIds: created.affectedIds}
      - id: accepted-cast
        type: UserActionTaken
        lane: transient
        fields: {details.actionType: [1], details.abilityGrpId: [0], affectorId: 1}
        equals: {affectedIds: consumer-reallocated.details.new_id}
counts:
  - match: {type: ManaPaid, lane: transient, equals: {affectorId: created.affectorId}}
    exactly: 1
  - match: {type: AbilityInstanceDeleted, lane: transient, equals: {affectedIds: created.affectedIds}}
    exactly: 1

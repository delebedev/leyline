name: Quantum Riddler initial Warp cast and entry draw
scenario: {suite: mechanics-protocol, id: warp-quantum-riddler}
frames:
- id: hand
  events:
  - id: hand-card
    type: Card
    lane: object
    where: {fields: {raw.zoneId: 31, 'raw.cardTypes[0]': Creature}}
    fields: {raw.zoneId: 31, raw.controllerSeatId: 1, 'raw.cardTypes[0]': Creature}
- id: cast
  events:
  - id: spell
    type: Card
    lane: object
    where: {fields: {raw.zoneId: 27}, equals: {raw.grpId: hand-card.raw.grpId}}
    fields: {raw.zoneId: 27, raw.controllerSeatId: 1}
    equals: {raw.grpId: hand-card.raw.grpId}
  - id: cast-reallocated
    type: ObjectIdChanged
    lane: transient
    keys: [orig_id, new_id]
    equals: {'affectedIds[0]': hand-card.affectorId, 'details.orig_id[0]': hand-card.affectorId, 'details.new_id[0]': spell.affectorId}
  - id: cast
    type: ZoneTransfer
    lane: transient
    keys: [zone_src, zone_dest, category]
    fields: {details.category: [CastSpell], details.zone_src: [31], details.zone_dest: [27]}
    equals: {affectedIds: cast-reallocated.details.new_id}
  - id: action
    where: {equals: {affectedIds: cast.affectedIds}}
    type: UserActionTaken
    lane: transient
    keys: [actionType, abilityGrpId, alternativeGrpId]
    fields: {details.actionType: [1], details.abilityGrpId: [0], details.alternativeGrpId.length: 1}
    equals: {affectedIds: cast.affectedIds}
  - id: option
    type: CastingTimeOption
    lane: persistent
    op: create
    keys: [alternateCostGrpId, type]
    fields: {details.type: [13]}
    equals: {affectorId: spell.affectorId, affectedIds: cast.affectedIds, details.alternateCostGrpId: action.details.alternativeGrpId}
- id: resolve
  events:
  - id: draw-ability
    type: Ability
    lane: object
    fields: {raw.zoneId: 27}
    equals: {raw.parentId: spell.affectorId, raw.objectSourceGrpId: spell.raw.grpId}
  - id: spell-resolution-started
    type: ResolutionStart
    lane: transient
    keys: [grpid]
    equals: {affectorId: 'cast.affectedIds[0]', 'details.grpid[0]': spell.raw.grpId}
  - id: spell-resolved
    type: ResolutionComplete
    lane: transient
    keys: [grpid]
    equals: {affectorId: 'cast.affectedIds[0]', 'details.grpid[0]': spell.raw.grpId}
  - id: spell-to-battlefield
    type: ZoneTransfer
    lane: transient
    keys: [zone_src, zone_dest, category]
    equals: {'affectedIds[0]': 'cast.affectedIds[0]'}
    fields:
      details.category: [Resolve]
      details.zone_src: [27]
      details.zone_dest: [28]
  - id: draw-trigger-created
    type: AbilityInstanceCreated
    lane: transient
    keys: [source_zone]
    equals: {affectorId: 'cast.affectedIds[0]', 'affectedIds[0]': draw-ability.affectorId}
    fields:
      details.source_zone: [28]
  - id: draw-trigger-source
    type: TriggeringObject
    lane: persistent
    op: create
    keys: [source_zone]
    equals: {affectorId: 'draw-trigger-created.affectedIds[0]', 'affectedIds[0]': draw-trigger-created.affectorId}
    fields:
      details.source_zone: [28]
  - id: option-retired
    type: CastingTimeOption
    lane: persistent
    op: delete
    keys: [alternateCostGrpId, type]
    sameRow: option
    fields: {details.type: [13]}
- id: draw-trigger
  events:
  - id: draw-resolution-started
    type: ResolutionStart
    lane: transient
    keys: [grpid]
    equals: {affectorId: 'draw-trigger-created.affectedIds[0]', 'details.grpid[0]': draw-ability.raw.grpId}
  - id: drawn-card-reallocated
    type: ObjectIdChanged
    lane: transient
    keys: [orig_id, new_id]
    equals: {affectorId: 'draw-trigger-created.affectedIds[0]'}
  - id: etb-draw
    type: ZoneTransfer
    lane: transient
    keys: [zone_src, zone_dest, category]
    equals: {affectorId: 'draw-trigger-created.affectedIds[0]', 'affectedIds[0]': 'drawn-card-reallocated.details.new_id[0]'}
    fields:
      details.category: [Draw]
      details.zone_src: [32]
      details.zone_dest: [31]
  - id: draw-resolved
    type: ResolutionComplete
    lane: transient
    keys: [grpid]
    equals: {affectorId: 'draw-trigger-created.affectedIds[0]', 'details.grpid[0]': draw-ability.raw.grpId}
  - id: draw-trigger-retired
    type: AbilityInstanceDeleted
    lane: transient
    keys: []
    equals: {affectorId: draw-trigger-created.affectorId, 'affectedIds[0]': 'draw-trigger-created.affectedIds[0]'}
  - id: draw-trigger-source-retired
    type: TriggeringObject
    lane: persistent
    op: delete
    keys: [source_zone]
    sameRow: draw-trigger-source
    fields:
      details.source_zone: [28]
windows:
- {id: option-holds, holds: option, until: option-retired}
- {id: draw-source-holds, holds: draw-trigger-source, until: draw-trigger-source-retired}
counts:
- match: {type: CastingTimeOption, lane: persistent, op: create, sameRow: option}
  exactly: 1
- match: {type: CastingTimeOption, lane: persistent, op: delete, sameRow: option}
  exactly: 1
- match: {type: TriggeringObject, lane: persistent, op: create, sameRow: draw-trigger-source}
  exactly: 1
- match: {type: TriggeringObject, lane: persistent, op: delete, sameRow: draw-trigger-source}
  exactly: 1

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leyline Debug</title>
<style>
  :root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --bg3: #0f3460;
    --fg: #e0e0e0;
    --fg2: #8888aa;
    --accent: #e94560;
    --blue: #4ea8de;
    --green: #56c596;
    --red: #e94560;
    --orange: #f4845f;
    --yellow: #f7d354;
    --violet: #c792ea;
    --mono: 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
    --border: #2a2a4e;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #header h1 { font-size: 14px; color: var(--accent); font-weight: 700; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
  }
  .pill-ok { background: rgba(86,197,150,0.2); color: var(--green); }
  .pill-off { background: rgba(233,69,96,0.2); color: var(--red); }

  .actions {
    display: flex;
    gap: 8px;
    padding: 8px 16px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .actions button {
    background: var(--bg3);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 12px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
  }
  .actions button:hover { border-color: var(--accent); }
  .actions input {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font-family: var(--mono);
    font-size: 11px;
    width: 200px;
  }

  #result {
    padding: 8px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    max-height: 120px;
    overflow-y: auto;
    white-space: pre-wrap;
    font-size: 11px;
    color: var(--fg2);
  }
  #result.ok { color: var(--green); }
  #result.err { color: var(--red); }

  #logs {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px;
  }
  .log-entry {
    padding: 2px 0;
    border-bottom: 1px solid rgba(42,42,78,0.4);
    display: flex;
    gap: 8px;
  }
  .log-ts { color: var(--fg2); flex-shrink: 0; }
  .log-level { flex-shrink: 0; width: 44px; font-weight: 600; }
  .log-level.ERROR { color: var(--red); }
  .log-level.WARN { color: var(--orange); }
  .log-level.INFO { color: var(--blue); }
  .log-level.DEBUG { color: var(--fg2); }
  .log-logger { color: var(--violet); flex-shrink: 0; width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .log-msg { color: var(--fg); flex: 1; white-space: pre-wrap; word-break: break-all; }

  #footer {
    padding: 4px 16px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    color: var(--fg2);
    font-size: 10px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div id="header">
  <h1>Leyline Debug</h1>
  <span id="sse-status" class="pill pill-off">disconnected</span>
  <span style="flex:1"></span>
</div>

<div class="actions">
  <button onclick="bestPlay()">Best Line</button>
  <button onclick="priorityLog()">Priority Log</button>
  <button onclick="injectFull()">Push Full State</button>
  <input id="puzzle-name" placeholder="puzzle name (e.g. etb-charming-prince)">
  <button onclick="setPuzzle()">Set Puzzle</button>
  <button onclick="clearPuzzle()">Clear Puzzle</button>
  <button onclick="getPuzzle()">Current Puzzle</button>
</div>

<div id="result"></div>

<div id="logs"></div>

<div id="footer">
  <span id="log-count">0</span> log entries | SSE log stream
</div>

<script>
const MAX_LOGS = 2000;
const logsEl = document.getElementById('logs');
const resultEl = document.getElementById('result');
const statusEl = document.getElementById('sse-status');
const countEl = document.getElementById('log-count');
let logCount = 0;

// --- SSE ---
function connectSSE() {
  const es = new EventSource('/api/events');
  es.onopen = () => {
    statusEl.textContent = 'connected';
    statusEl.className = 'pill pill-ok';
  };
  es.onerror = () => {
    statusEl.textContent = 'disconnected';
    statusEl.className = 'pill pill-off';
  };
  es.addEventListener('log', (e) => {
    try {
      const entry = JSON.parse(e.data);
      appendLog(entry);
    } catch (_) {}
  });
}

function appendLog(entry) {
  const div = document.createElement('div');
  div.className = 'log-entry';
  const ts = new Date(entry.ts).toLocaleTimeString('en', { hour12: false, fractionalSecondDigits: 3 });
  div.innerHTML =
    '<span class="log-ts">' + ts + '</span>' +
    '<span class="log-level ' + entry.level + '">' + entry.level + '</span>' +
    '<span class="log-logger">' + esc(entry.logger) + '</span>' +
    '<span class="log-msg">' + esc(entry.message) + '</span>';
  logsEl.appendChild(div);
  logCount++;
  // Trim old entries
  while (logsEl.children.length > MAX_LOGS) {
    logsEl.removeChild(logsEl.firstChild);
  }
  countEl.textContent = logCount;
  // Auto-scroll if near bottom
  if (logsEl.scrollHeight - logsEl.scrollTop - logsEl.clientHeight < 100) {
    logsEl.scrollTop = logsEl.scrollHeight;
  }
}

function esc(s) {
  const d = document.createElement('span');
  d.textContent = s;
  return d.innerHTML;
}

// --- Actions ---
async function bestPlay() {
  await fetchAndShow('/api/best-play');
}

async function priorityLog() {
  await fetchAndShow('/api/priority-log');
}

async function injectFull() {
  await fetchAndShow('/api/inject-full', { method: 'POST' });
}

async function setPuzzle() {
  const name = document.getElementById('puzzle-name').value.trim();
  if (!name) { showResult('Enter a puzzle name', true); return; }
  await fetchAndShow('/api/puzzle?file=' + encodeURIComponent(name), { method: 'POST' });
}

async function clearPuzzle() {
  await fetchAndShow('/api/puzzle', { method: 'POST' });
}

async function getPuzzle() {
  await fetchAndShow('/api/puzzle');
}

async function fetchAndShow(url, opts) {
  try {
    const r = await fetch(url, opts || {});
    const text = await r.text();
    try {
      const json = JSON.parse(text);
      showResult(JSON.stringify(json, null, 2), !r.ok);
    } catch (_) {
      showResult(text, !r.ok);
    }
  } catch (e) {
    showResult('Fetch error: ' + e.message, true);
  }
}

function showResult(text, isErr) {
  resultEl.textContent = text;
  resultEl.className = isErr ? 'err' : 'ok';
}

connectSSE();
</script>
</body>
</html>

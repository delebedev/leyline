complexity:
  LongMethod:
    allowedLines: 100
  LongParameterList:
    allowedFunctionParameters: 10
    allowedConstructorParameters: 12
  CyclomaticComplexMethod:
    allowedComplexity: 25
  CognitiveComplexMethod:
    active: false
  TooManyFunctions:
    active: false
  LargeClass:
    allowedLines: 600
  NestedBlockDepth:
    allowedDepth: 6
  ComplexCondition:
    allowedConditions: 5

style:
  # Detekt 2 enables these migrations by default. Keep the existing lint
  # contract; adopt them separately from the build-toolchain upgrade.
  AbstractClassCanBeInterface:
    active: false
  UseCheckNotNull:
    active: false
  UseOrEmpty:
    active: false
  UseRequireNotNull:
    active: false
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    max: 8
  MaxLineLength:
    maxLineLength: 140
  ForbiddenComment:
    active: false
  UnusedPrivateClass:
    active: true
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  UnusedParameter:
    active: true
  LoopWithTooManyJumpStatements:
    active: false
  CanBeNonNullable:
    active: true

empty-blocks:
  EmptyFunctionBlock:
    active: false

potential-bugs:
  UnsafeCallOnNullableType:
    active: false
  DoubleMutabilityForCollection:
    active: true
  HasPlatformType:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  CastToNullableType:
    active: true
  # Known false-positive-prone in TR mode (continue / ?: / takeIf control flow).
  # Real unreachable code is caught by kotlinc warnings and IDE inspections.
  UnreachableCode:
    active: false
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  ImplicitDefaultLocale:
    active: true

performance:
  SpreadOperator:
    active: false
  ArrayPrimitive:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: true
  NotImplementedDeclaration:
    active: true
  RethrowCaughtException:
    active: true

naming:
  # Detekt 2 additionally reports nested implicit `it` parameters. Preserve
  # the prior rule surface during the toolchain migration.
  NoNameShadowing:
    active: false

leyline:
  TrivialKDoc:
    active: true
  BooleanAssertion:
    active: true
  VacuousTestSkip:
    active: true
  EmptyAssertion:
    active: true
  MissingAssertSoftly:
    active: true
    threshold: 3
    excludes: ['**/native/src/test/**']
  FunSpecMissingTags:
    active: true
    includes: ['**/engine/src/test/**']
  NoGameInMappers:
    active: true
  NoThreadSleepInTests:
    active: true
    includes: ['**/test/**', '**/*Test.kt', '**/*Tests.kt']
  NoTimingAssertsInTests:
    active: true
    includes: ['**/test/**', '**/*Test.kt', '**/*Tests.kt']
  TierPlacementCheck:
    active: true
  TestLayoutCheck:
    active: true
    includes: ['**/engine/src/test/**']
  WeakAssertionOnly:
    active: true
    includes: ['**/test/**', '**/*Test.kt', '**/*Tests.kt']
    excludes: ['**/native/src/test/**']

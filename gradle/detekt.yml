build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 100
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 12
  CyclomaticComplexMethod:
    threshold: 25
  CognitiveComplexMethod:
    active: false
  TooManyFunctions:
    active: false
  LargeClass:
    threshold: 600
  NestedBlockDepth:
    threshold: 6
  ComplexCondition:
    threshold: 5

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    max: 8
  MaxLineLength:
    maxLineLength: 160
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    active: true
  UnusedParameter:
    active: true
  LoopWithTooManyJumpStatements:
    active: false
  CanBeNonNullable:
    active: true

empty-blocks:
  EmptyFunctionBlock:
    active: false

potential-bugs:
  DoubleMutabilityForCollection:
    active: true
  HasPlatformType:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  CastToNullableType:
    active: true
  # Known false-positive-prone in TR mode (continue / ?: / takeIf control flow).
  # Real unreachable code is caught by kotlinc warnings and IDE inspections.
  UnreachableCode:
    active: false
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  ImplicitDefaultLocale:
    active: true

performance:
  SpreadOperator:
    active: false
  ArrayPrimitive:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: true
  NotImplementedDeclaration:
    active: true
  RethrowCaughtException:
    active: true

leyline:
  TrivialKDoc:
    active: true
  BooleanAssertion:
    active: true
  VacuousTestSkip:
    active: true
  EmptyAssertion:
    active: true
  MissingAssertSoftly:
    active: true
    threshold: 3
  FunSpecMissingTags:
    active: true
  NoGameInMappers:
    active: true
